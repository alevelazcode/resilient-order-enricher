spring:
  application:
    name: resilient-order-enricher

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:order_worker}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}

  webflux:
    base-path: /

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  observations:
    key-values:
      service.name: resilient-order-enricher

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: true

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topics:
    orders: ${KAFKA_ORDERS_TOPIC:orders}
    dlq: ${KAFKA_DLQ_TOPIC:orders-dlq}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP:order-worker-group}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:10}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    processing-timeout: ${KAFKA_PROCESSING_TIMEOUT:30s}

enricher-api:
  base-url: ${ENRICHER_API_BASE_URL:http://localhost:8080}
  timeout:
    connect: ${ENRICHER_API_CONNECT_TIMEOUT:5000}
    read: ${ENRICHER_API_READ_TIMEOUT:10000}
    write: ${ENRICHER_API_WRITE_TIMEOUT:10000}
    response: ${ENRICHER_API_RESPONSE_TIMEOUT:30000}

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 5s
      productService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 5s

  retry:
    instances:
      customerService:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.resilient.orderworker.domain.exception.ExternalServiceException
        ignore-exceptions:
          - com.resilient.orderworker.domain.exception.CustomerNotFoundException
          - com.resilient.orderworker.domain.exception.ProductNotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - java.util.concurrent.TimeoutException
      productService:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.resilient.orderworker.domain.exception.ExternalServiceException
        ignore-exceptions:
          - com.resilient.orderworker.domain.exception.CustomerNotFoundException
          - com.resilient.orderworker.domain.exception.ProductNotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - java.util.concurrent.TimeoutException

  timelimiter:
    instances:
      customerService:
        timeout-duration: 4s
        cancel-running-future: true
      productService:
        timeout-duration: 4s
        cancel-running-future: true

  bulkhead:
    instances:
      customerService:
        max-concurrent-calls: 25
        max-wait-duration: 100ms
      productService:
        max-concurrent-calls: 50
        max-wait-duration: 100ms

app:
  scheduler:
    failed-messages:
      enabled: ${FAILED_MESSAGE_SCHEDULER_ENABLED:true}
      fixed-delay: ${FAILED_MESSAGE_RETRY_INTERVAL:30000}

logging:
  level:
    com.resilient.orderworker: ${LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:WARN}
    org.mongodb.driver: ${MONGODB_LOG_LEVEL:WARN}
  # Console + JSON layouts are configured in logback-spring.xml (profile aware).
